# REMINISCENCE — packaging & tooling configuration
# Local-first multimodal AI memory engine for Snapdragon-powered Windows PCs.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reminiscence"
version = "0.1.0"
description = "REMINISCENCE — your private, local-first multimodal AI memory engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reminiscence Team" }]
keywords = ["memory", "multimodal", "local-first", "offline", "snapdragon", "qnn"]

# Core runtime dependencies: everything needed to run the offline core
# (SQLite/FTS5 ship with CPython; NumPy powers the vector index).
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Document parsers
documents = [
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6",
]
# Media handling (FFmpeg must be installed separately on the system PATH)
media = []
# Audio transcription (ONNX Whisper path)
audio = [
    "onnxruntime>=1.17",
]
# OCR / vision
vision = [
    "onnxruntime>=1.17",
    "Pillow>=10.0",
]
# General ONNX AI runtime (embeddings, ASR, OCR, reranker)
ai = [
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
]
# Qualcomm QNN execution provider (Windows ARM64 / Snapdragon only)
npu = [
    "onnxruntime-qnn>=1.17; sys_platform == 'win32' and platform_machine == 'ARM64'",
]
# Desktop UI
ui = [
    "PySide6>=6.6",
]
# Development tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
test = ["reminiscence[dev]"]

[project.scripts]
reminiscence = "reminiscence.app.main:main"

[tool.setuptools.packages.find]
include = ["reminiscence*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["reminiscence/tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:reminiscence.*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter; long docstrings are fine
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"reminiscence/tests/*" = ["B011"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "reminiscence.tests.*"
ignore_errors = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reminiscence"
version = "0.1.0"
description = "Local-first multimodal personal memory engine with an animated PySide6 desktop UI and Snapdragon-aware AI runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
documents = ["PyMuPDF>=1.24", "python-docx>=1.1", "python-pptx>=0.6"]
media = []
audio = ["onnxruntime>=1.17,<2"]
vision = ["onnxruntime>=1.17,<2", "Pillow>=10,<13"]
ai = ["onnxruntime>=1.17,<2", "tokenizers>=0.19,<1"]
npu = ["onnxruntime-qnn>=1.17,<2; sys_platform == 'win32' and platform_machine == 'ARM64'"]
ui = ["PySide6>=6.6,<7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]
all = ["reminiscence[documents,audio,vision,ai,ui]"]

[project.scripts]
reminiscence = "reminiscence.app.main:main"
reminiscence-gui = "reminiscence.app.ui.__main__:main"

[tool.setuptools.packages.find]
include = ["reminiscence*"]

[tool.pytest.ini_options]
testpaths = ["reminiscence/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
